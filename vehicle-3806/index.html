<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استمارة مركبة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :.page{
  width:min(100%,760px);
  margin:0 auto;
  padding:16px 12px 28px;
}

.hero{
  background:linear-gradient(135deg,var(--green-1),var(--green-2) 55%,var(--green-3));
  border-radius:30px;
  padding:22px 18px 18px;
  box-shadow:var(--shadow);
  color:#fff;
  text-align:center;
}

.seal{
  width:96px;
  height:96px;
  margin:0 auto 14px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.12);
  border:2px solid rgba(255,255,255,.18);
  box-shadow:
    inset 0 0 0 6px rgba(255,255,255,.05),
    0 8px 20px rgba(0,0,0,.10);
}

.hero-title{
  margin:0;
  font-size:17px;
  font-weight:700;
  opacity:.96;
}

.hero-sub{
  margin:6px 0 0;
  font-size:13px;
  opacity:.88;
}

.content{
  padding:20px 4px 0;
}

h1{
  margin:0 0 8px;
  font-size:clamp(28px,5vw,48px);
  line-height:1.15;
  font-weight:800;
  text-align:right;
  color:var(--text);
}

.lead{
  margin:0;
  font-size:15px;
  line-height:1.8;
  color:#303833;
  text-align:right;
}

.lead + .lead{
  margin-top:4px;
}

.panel{
  margin-top:18px;
  background:rgba(255,255,255,.82);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 8px 22px rgba(0,0,0,.05);
  overflow:hidden;
}

.panel-head{
  padding:14px 16px 10px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#fff,#fbfaf7);
}

.panel-body{
  padding:4px 16px 12px;
}

.row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #efeadf;
}

.key{
  min-width:110px;
  font-size:13px;
  color:var(--muted);
  font-weight:700;
}

.value{
  flex:1;
  text-align:left;
  font-size:17px;
  line-height:1.6;
  font-weight:700;
  color:var(--text);
}

.value.small{
  font-size:16px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#eef7f2;
  color:#176548;
  border:1px solid #d6eadf;
  border-radius:999px;
  padding:6px 10px;
  font-size:13px;
  font-weight:700;
}

    @media (max-width:640px){
  .page{padding:14px 10px 24px}
  .hero{padding:18px 14px 16px;border-radius:26px}
  .seal{width:88px;height:88px;margin-bottom:12px}
  h1{font-size:26px}
  .lead{font-size:14px}
  .panel-body{padding:4px 14px 10px}
  .panel-head{padding:12px 14px 8px}
  .row{flex-direction:column;gap:4px;padding:10px 0}
  .key{min-width:auto}
  .value{text-align:right;font-size:16px}
  .value.small{font-size:15px}
  .badge{font-size:12px;padding:6px 10px}
}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="seal">
        <img src="IMG_7592.jpeg" alt="شعار مساندون">

      </div>
      <p class="hero-title">شعار مساندون</p>
      <p class="hero-sub">عرض منسق لبيانات الاستمارة</p>
    </section>

    <section class="content">
      <h1>استمارة مركبة</h1>
      <p class="lead">المملكة العربية السعودية</p>
      <p class="lead">تم عرض بيانات الاستمارة بنجاح</p>

      <div class="panel">
        <div class="panel-head">
          <p class="label">الجهة المالكة</p>
        </div>
        <div class="panel-body">
          <div class="row">
            <div class="key">الاسم</div>
            <div class="value">مؤسسة رمز التحقق للخدمات</div>
          </div>

          <div class="row">
            <div class="key">رقم اللوحة</div>
            <div class="value">3806</div>
          </div>

          <div class="row">
            <div class="key">نوع التسجيل</div>
            <div class="value small">استمارة مركبة</div>
          </div>

          <div class="row">
            <div class="key">حالة العرض</div>
            <div class="value">
              <span class="badge"><span class="dot"></span>تم التحقق بنجاح</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
