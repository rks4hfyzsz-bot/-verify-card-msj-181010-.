<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استمارة مركبة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f5f2ea;
      --card:#ffffff;
      --green-1:#0f6b53;
      --green-2:#148062;
      --green-3:#1f8d6f;
      --text:#16211c;
      --muted:#5f665f;
      --line:#e6e0d6;
      --soft:#f8f7f3;
      --shadow:0 18px 50px rgba(0,0,0,.10);
      --radius:26px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:"Cairo",sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .page{
      width:min(100%,760px);
      margin:0 auto;
      padding:28px 16px 40px;
    }

    .hero{
      background:linear-gradient(135deg,var(--green-1),var(--green-2) 55%,var(--green-3));
      border-radius:36px;
      padding:34px 24px 26px;
      box-shadow:var(--shadow);
      color:#fff;
      text-align:center;
    }

    .seal{
      width:126px;
      height:126px;
      margin:0 auto 18px;
      border-radius:50%;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.12);
      border:2px solid rgba(255,255,255,.18);
      box-shadow:
        inset 0 0 0 8px rgba(255,255,255,.05),
        0 10px 26px rgba(0,0,0,.12);
    }

    .seal img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .hero-title{
      margin:0;
      font-size:20px;
      font-weight:700;
      opacity:.96;
    }

    .hero-sub{
      margin:8px 0 0;
      font-size:14px;
      opacity:.88;
    }

    .content{
      padding:28px 6px 0;
    }

    h1{
      margin:0 0 10px;
      font-size:clamp(34px,6vw,58px);
      line-height:1.2;
      font-weight:800;
      text-align:right;
      color:var(--text);
    }

    .lead{
      margin:0;
      font-size:17px;
      line-height:1.9;
      color:#303833;
      text-align:right;
    }

    .lead + .lead{
      margin-top:6px;
    }

    .panel{
      margin-top:26px;
      background:rgba(255,255,255,.78);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:0 8px 22px rgba(0,0,0,.05);
      overflow:hidden;
    }

    .panel-head{
      padding:18px 20px 12px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#fff,#fbfaf7);
    }

    .panel-head .label{
      margin:0;
      font-size:14px;
      color:#8a8a83;
      font-weight:700;
    }

    .panel-body{
      padding:8px 20px 18px;
      background:var(--card);
    }

    .row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      padding:16px 0;
      border-bottom:1px solid #efeadf;
    }

    .row:last-child{
      border-bottom:none;
    }

    .key{
      min-width:120px;
      font-size:14px;
      color:var(--muted);
      font-weight:700;
    }

    .value{
      flex:1;
      text-align:left;
      font-size:20px;
      line-height:1.7;
      font-weight:700;
      color:var(--text);
    }

    .value.small{
      font-size:18px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:#eef7f2;
      color:#176548;
      border:1px solid #d6eadf;
      border-radius:999px;
      padding:8px 12px;
      font-size:14px;
      font-weight:700;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:#1d8b67;
      display:inline-block;
    }

    @media (max-width:640px){
      .page{padding:18px 12px 34px}
      .hero{padding:28px 18px 22px;border-radius:30px}
      .seal{width:112px;height:112px;margin-bottom:16px}
      h1{font-size:32px}
      .lead{font-size:16px}
      .panel-body{padding:6px 16px 14px}
      .panel-head{padding:16px 16px 10px}
      .row{flex-direction:column;gap:6px;padding:14px 0}
      .key{min-width:auto}
      .value{text-align:right;font-size:18px}
      .value.small{font-size:17px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="seal">
        <img src="7DC7DA55-90D4-447E-9EE1-7C8A6D906418.jpeg" alt="شعار مساندون">
      </div>
      <p class="hero-title">شعار مساندون</p>
      <p class="hero-sub">عرض منسق لبيانات الاستمارة</p>
    </section>

    <section class="content">
      <h1>استمارة مركبة</h1>
      <p class="lead">المملكة العربية السعودية</p>
      <p class="lead">تم عرض بيانات الاستمارة بنجاح</p>

      <div class="panel">
        <div class="panel-head">
          <p class="label">الجهة المالكة</p>
        </div>
        <div class="panel-body">
          <div class="row">
            <div class="key">الاسم</div>
            <div class="value">مؤسسة رمز التحقق للخدمات</div>
          </div>

          <div class="row">
            <div class="key">رقم اللوحة</div>
            <div class="value">3806</div>
          </div>

          <div class="row">
            <div class="key">نوع التسجيل</div>
            <div class="value small">استمارة مركبة</div>
          </div>

          <div class="row">
            <div class="key">حالة العرض</div>
            <div class="value">
              <span class="badge"><span class="dot"></span>تم التحقق بنجاح</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
